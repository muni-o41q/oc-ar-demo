<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>ARキャラクター図鑑 | オープンキャンパス</title>

  <!-- A-Frame / AR.js (CDN) -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
  <!-- glTFのアニメーション(歩く・走るなど)を再生するための拡張 -->
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }

    #loading {
      position: fixed; inset: 0; z-index: 999;
      background: #10131a; color: #fff;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; font-family: sans-serif; text-align: center;
      transition: opacity .4s ease;
    }
    #loading h1 { font-size: 1.3rem; margin-bottom: .5rem; }
    #loading p { font-size: .9rem; opacity: .8; margin: .2rem 0; }
    #loading .spinner {
      width: 40px; height: 40px; margin-top: 1.2rem;
      border: 4px solid rgba(255,255,255,.25);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #hint {
      position: fixed; left: 0; right: 0; bottom: 18px; z-index: 50;
      text-align: center; font-family: sans-serif; color: #fff;
      text-shadow: 0 1px 4px rgba(0,0,0,.8);
      font-size: .95rem; padding: 0 12px; pointer-events: none;
    }
  </style>

  <script>
    // ドラゴンのglTFには「Cloth Backdrop」という背景用の板ポリゴンが同梱されており、
    // 元のガラス質素材（KHR_materials_transmission）はAR.js環境では正しく描画されず、
    // 背景の板だけが見えて本体が動いていないように見える現象が起きる。
    // モデル読み込み後にこの2点を補正する。
    AFRAME.registerComponent('fix-dragon-model', {
      schema: { color: { type: 'color', default: '#2f8f4e' } },
      init: function () {
        this.el.addEventListener('model-loaded', () => {
          const mesh = this.el.getObject3D('mesh');
          if (!mesh) return;
          const solidMaterial = new THREE.MeshStandardMaterial({
            color: this.data.color,
            metalness: 0.15,
            roughness: 0.55
          });
          mesh.traverse((node) => {
            if (node.name === 'Cloth Backdrop') {
              node.visible = false; // 背景板を非表示に
              return;
            }
            if (node.isMesh) {
              node.material = solidMaterial; // 半透明ガラス材質→不透明な単色材質に置き換え
              node.castShadow = false;
            }
          });
        });
      }
    });
  </script>
</head>
<body>

  <div id="loading">
    <h1>ARキャラクターを準備中…</h1>
    <p>カメラの使用を許可してください</p>
    <p>3枚のマーカーカードにカメラを向けてね</p>
    <div class="spinner"></div>
  </div>

  <div id="hint">📷 マーカーカードにスマホのカメラを向けてください</div>

  <a-scene
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; precision: medium;"
    id="scene"
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
    embedded
    loading-screen="enabled: false"
  >

    <a-assets timeout="20000">
      <a-asset-item id="fox-model"   src="models/fox.glb"></a-asset-item>
      <a-asset-item id="dragon-model" src="models/dragon.glb"></a-asset-item>
      <a-asset-item id="hero-model"  src="models/hero.glb"></a-asset-item>
    </a-assets>

    <!-- ① マーカー: 手裏剣風アイコン → キャラ: きつね（動物） -->
    <a-marker type="pattern" url="markers/marker1.patt" id="marker-fox" emitevents="true">
      <a-entity
        gltf-model="#fox-model"
        scale="0.045 0.045 0.045"
        rotation="0 180 0"
        position="0 0 0"
        animation-mixer="clip: Walk; loop: repeat"
        animation="property: position; dir: alternate; dur: 1400; easing: easeInOutSine; to: 0 0.1 0; loop: true"
      ></a-entity>
    </a-marker>

    <!-- ② マーカー: ジグザグ帯アイコン → キャラ: 歩く人型ロボット（おもしろキャラ） -->
    <a-marker type="pattern" url="markers/marker2.patt" id="marker-hero" emitevents="true">
      <a-entity
        gltf-model="#hero-model"
        scale="0.55 0.55 0.55"
        rotation="0 180 0"
        position="0 0 0"
        animation-mixer="loop: repeat"
        animation="property: rotation; dir: normal; dur: 6000; easing: linear; from: 0 180 0; to: 0 540 0; loop: true"
      ></a-entity>
    </a-marker>

    <!-- ③ マーカー: 三角形クラスターアイコン → キャラ: ドラゴン -->
    <a-marker type="pattern" url="markers/marker3.patt" id="marker-dragon" emitevents="true">
      <a-entity
        gltf-model="#dragon-model"
        fix-dragon-model="color: #2f8f4e"
        scale="0.5 0.5 0.5"
        rotation="0 180 0"
        position="0 0 0"
        animation__spin="property: rotation; dir: normal; dur: 9000; easing: linear; from: 0 180 0; to: 0 540 0; loop: true"
        animation__float="property: position; dir: alternate; dur: 1600; easing: easeInOutSine; to: 0 0.15 0; loop: true"
      ></a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // URLに ?debug=1 を付けると、AR.jsの検出デバッグ表示（白黒2値化映像＋検出枠）が見える
    if (new URLSearchParams(location.search).get('debug') === '1') {
      document.getElementById('scene').setAttribute('arjs', { debugUIEnabled: true });
    }

    window.addEventListener('load', () => {
      const scene = document.querySelector('a-scene');
      const loading = document.getElementById('loading');
      const hide = () => {
        loading.style.opacity = '0';
        setTimeout(() => loading.style.display = 'none', 400);
      };
      if (scene.hasLoaded) { hide(); } else { scene.addEventListener('loaded', hide); }
      // 念のためのフォールバック（読み込みが長引いてもUIを固定しない）
      setTimeout(hide, 8000);
    });
  </script>

</body>
</html>
